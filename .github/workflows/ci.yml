name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: bookifyapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: "postgresql://docker:docker@localhost:5432/bookifyapi?schema=public"
        run: npx prisma migrate deploy

      - name: Run Unit Tests
        env:
          DATABASE_URL: "postgresql://docker:docker@localhost:5432/bookifyapi?schema=public"
          JWT_SECRET: "test-secret"
        run: yarn test

      - name: Run E2E Tests
        env:
          DATABASE_URL: "postgresql://docker:docker@localhost:5432/bookifyapi?schema=public"
          JWT_SECRET: "test-secret"
        run: yarn test:e2e

      - name: OpenAPI Contract Check
        env:
          DATABASE_URL: "postgresql://docker:docker@localhost:5432/bookifyapi?schema=public"
          JWT_SECRET: "test-secret"
        run: yarn openapi:check

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bootstrap initial release or run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "package.json version must be stable SemVer for the initial release: $VERSION" >&2
              exit 1
            fi
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes
          else
            yarn release
          fi
