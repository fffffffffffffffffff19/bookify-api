services:
  api:
    build: .
    container_name: bookify-api
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=dev
      - PORT=3333
      - DATABASE_URL=postgresql://bookify_user:bookify_pass@postgres:5432/bookify_db?schema=public
      - JWT_SECRET=your-super-secret-jwt-key
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: bitnami/postgresql:latest
    container_name: bookify-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=bookify_user
      - POSTGRES_PASSWORD=bookify_pass
      - POSTGRES_DB=bookify_db
    volumes:
      - bookify_pgdata:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookify_user -d bookify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookify_pgdata: